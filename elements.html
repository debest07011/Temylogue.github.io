<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Temilogue Reviews</title>
  <link rel="stylesheet" href="assets/css/main.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <noscript><link rel="stylesheet" href="assets/css/noscript.css" /></noscript>
  <style>
    .review-card {
      border: 1px solid #ccc;
      border-radius: 1rem;
      padding: 1.5rem;
      margin-bottom: 1rem;
      background: #f9f9f9;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      animation: fadeIn 0.5s ease;
    }
    .review-card img {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      object-fit: cover;
    }
    .review-stars {
      color: #f7c948;
      margin-top: 0.5rem;
    }
    .pagination {
      display: flex;
      justify-content: center;
      margin-top: 2rem;
    }
    .pagination button {
      background: none;
      border: none;
      padding: 0.5rem 1rem;
      font-weight: bold;
      cursor: pointer;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="is-preload">
  <div id="wrapper">

    <header id="header">
      <a href="index.html" class="logo">Temilogue</a>
    </header>

    <nav id="nav">
      <ul class="links">
        <li><a href="index.html">Home</a></li>
        <li><a href="generic.html">About me </a></li>
        <li class="active"><a href="elements.html">Reviews</a></li>
      </ul>
    </nav>

    <div id="main">
      <section class="post">
        <header class="major">
          <h1>Reflections from Our Readers</h1>
          <p>Words they’ve left behind after reading ours...</p>
        </header>

        <div id="review-container"></div>

        <div class="pagination">
          <button onclick="changePage(-1)">&laquo; Prev</button>
          <button onclick="changePage(1)">Next &raquo;</button>
        </div>

        <h2>Leave a Review</h2>
        <form method="post" action="#" onsubmit="event.preventDefault(); addReview();">
          <div class="row gtr-uniform">
            <div class="col-6 col-12-xsmall">
              <input type="text" id="reviewer-name" placeholder="Your Name" required />
            </div>
            <div class="col-6 col-12-xsmall">
              <input type="email" id="reviewer-email" placeholder="Your Email" required />
            </div>
            <div class="col-12">
              <textarea id="reviewer-message" placeholder="Your Review" rows="6" required></textarea>
            </div>
            <div class="col-12">
              <label for="reviewer-stars">Rating</label><br />
              <select id="reviewer-stars" required>
                <option value="" disabled selected>Select stars</option>
                <option value="5">★★★★★ (5 stars)</option>
                <option value="4">★★★★☆ (4 stars)</option>
                <option value="3">★★★☆☆ (3 stars)</option>
                <option value="2">★★☆☆☆ (2 stars)</option>
                <option value="1">★☆☆☆☆ (1 star)</option>
              </select>
            </div>
            <div class="col-12">
              <ul class="actions">
                <li><input type="submit" value="Submit Review" class="primary" /></li>
              </ul>
            </div>
          </div>
        </form>
      </section>
    </div>

    <footer id="footer">
      <section class="split contact">
        <section class="alt">
          <h3>Address</h3>
          <p>Lagos, Nigeria</p>
        </section>
        <section>
          <h3>Email</h3>
          <p><a href="#">temilogue@reflections.ng</a></p>
        </section>
      </section>
    </footer>

    <div id="copyright">
      <ul><li>&copy; Temilogue</li><li>Site by Temilola</li></ul>
    </div>
  </div>

  <!-- Scripts -->
  <script>
    function md5(string) {
      return CryptoJS.MD5(string.trim().toLowerCase()).toString();
    }

    let reviews = JSON.parse(localStorage.getItem("temylogue_reviews")) || [
      {
        name: "Jane Doe",
        email: "jane@example.com",
        stars: 5,
        content: "Your words healed something I didn’t know needed healing. Thank you.",
        image: "https://www.gravatar.com/avatar/" + md5("jane@example.com") + "?d=identicon"
      },
      {
        name: "Ahmed Musa",
        email: "ahmed@example.com",
        stars: 4,
        content: "Temilogue reminds me how beautiful vulnerability can be.",
        image: "https://www.gravatar.com/avatar/" + md5("ahmed@example.com") + "?d=identicon"
      }
    ];

    let page = 0;
    const perPage = 2;

    function saveToStorage() {
      localStorage.setItem("temylogue_reviews", JSON.stringify(reviews));
    }

    function renderReviews() {
      const container = document.getElementById("review-container");
      container.innerHTML = "";
      const start = page * perPage;
      const selected = reviews.slice(start, start + perPage);
      selected.forEach(r => {
        container.innerHTML += `
          <div class="review-card">
            <div style="display: flex; align-items: center; gap: 1rem;">
              <img src="${r.image}" alt="${r.name}">
              <strong>${r.name}</strong>
            </div>
            <div class="review-stars">
              ${"★".repeat(r.stars)}${"☆".repeat(5 - r.stars)}
            </div>
            <p>${r.content}</p>
          </div>
        `;
      });
    }

    function changePage(offset) {
      const maxPage = Math.ceil(reviews.length / perPage);
      page = Math.max(0, Math.min(page + offset, maxPage - 1));
      renderReviews();
    }

    function addReview() {
      const name = document.getElementById("reviewer-name").value;
      const email = document.getElementById("reviewer-email").value;
      const message = document.getElementById("reviewer-message").value;
      const stars = parseInt(document.getElementById("reviewer-stars").value);
      const hash = md5(email);
      const image = "https://www.gravatar.com/avatar/" + hash + "?d=identicon";
      
      reviews.unshift({
        name,
        email,
        stars,
        content: message,
        image
      });

      saveToStorage();
      renderReviews();
      document.querySelector("form").reset();
      alert("Thank you for your review!");
    }

    renderReviews();
  </script>

  <!-- Load MD5 library for Gravatar -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
</body>
</html>
